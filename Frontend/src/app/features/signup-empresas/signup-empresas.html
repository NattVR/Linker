<section class="backgroud">
  <div class="signup-form">
    <h2>Registrate</h2>

    <div class="step-indicator">
      <div class="step" [class.active]="currentStep === 1" [class.completed]="currentStep > 1">
        <span class="step-number">{{ currentStep > 1 ? '✓' : '1' }}</span>
        <span class="step-label">Datos Empresariales</span>
      </div>
      <div class="step-divider"></div>
      <div class="step" [class.active]="currentStep === 2">
        <span class="step-number">2</span>
        <span class="step-label">Credenciales</span>
      </div>
    </div>

    @if (currentStep=== 1) {
    <form [formGroup]="empresaForm">
      <div class="form-step">
        <div class="form-group">
          <label>Nombre Empresa</label>
          <input type="text" id="name_empresa" formControlName="name_empresa" placeholder="Tu empresa" />
        </div>

        <div class="form-group">
          <label>NIT</label>
          <input type="text" id="NIT" formControlName="NIT" placeholder="Ej:12345" />
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-primary" (click)="nextStep()">Continuar</button>
      </div>
    </form>
    } 
    
    @if (currentStep===2) {
    <form [formGroup]="signupEmpresasForm">
      <div class="form-step">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ingresa tu email"
            formControlName="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            formControlName="password"
          />
        </div>

        <div class="form-group">
          <label for="password">Confirmar contraseña</label>
          <input
            type="password"
            id="repassword"
            name="repassword"
            placeholder="Ingresa tu contraseña"
            formControlName="repassword"
          />
        </div>

      </div>

      <div class="button-group">
        <button type="button" class="btn-secondary" (click)="previousStep()">Atrás</button>
        <button type="submit" class="btn-primary" (click)="onSignupEmpresa()">Registrar</button>
      </div>
    </form>
    }

    <div class="link">
      <a routerLink="/login">
        ¿Ya eres miembro? <br />
        Inicia Sesión
      </a>
    </div>
  </div>
</section>
