<section>
  <div class="header-login">
    <h1>Bienvenido de nuevo</h1>
    <p>Haz match con tu próxima oportunidad</p>
   
  </div>

  <div class="loginForm">
    <h2>Iniciar Sesión</h2>
    <form [formGroup]="loginForm">
      <a routerLink="/signup">¿Es tu primera vez? Regístrate</a>
      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Ingresa tu email"
          formControlName="email"
        />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          formControlName="password"
        />
      </div>
    </form>

    <a>¿Olvidaste tu contraseña?</a>
    <div class="form-group">
      <button type="submit" (click)="onLogin()">Iniciar sesión <i class="fa-solid fa-arrow-right" style="color: #ffffff;"></i> </button>
  
    </div>
  </div>
</section>
