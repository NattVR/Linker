<div class="card-section">
  @if(list.length===0){
          <button class="btn-refresh" (click)="getCards()">
            ¡Carguemos Postulantes!
            <i class="fa-solid fa-arrows-rotate"></i>    
          </button>
  }
  @else{

  @for(p of list; track p.id) {
  <div class="cards"
       #card
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPointerUp(p)"
       >

    <div class="card-content">
      <div class="card-image-container">
        <img [src]="p.foto" alt="Foto postulante" class="card-image" />
        <div class="distance-badge"><i class="fa-solid fa-location-dot"></i>{{ p.ubicacion }}</div>
      </div>

      <div class="card-info">
        <div class="title">
          <div class="card-name"><i class="fa-solid fa-user"></i>{{ p.name + ' '+ p.lastname }}</div>
          <div class="card-experience"><i class="fa-solid fa-user"></i>{{ p.anos_experiencia }} años experiencia</div>
        </div>

        <div class="tags">
          @for(habilidad of p.habilidades; track habilidad) {
            <div class="tag">{{ habilidad }}</div>
          }
        </div>

        <div class="tags">
          @for(idioma of p.idiomas; track idioma) {
            <div class="tag-language">{{ idioma }}</div>
          }
        </div>


        <div class="curriculum-row">
          <button class="curriculum-btn">
            Ver Curriculum
            <i class="fa-solid fa-location-dot"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  }}
</div>
