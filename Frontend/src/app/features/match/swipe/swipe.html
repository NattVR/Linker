<div class="card-section">
  @if(list.length===0){
    
          <button class="btn-refresh" (click)="getCards()">
            ¡Carguemos Vacantes!
            <i class="fa-solid fa-arrows-rotate"></i>          
          </button>
  
  }
  @else{
  @for(v of list; track v.id_vacante) {
  <div class="cards"
       #card
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPointerUp(v)"
       >

    <div class="card-content">
      <div class="card-image-container">
        <img alt="Card Image" class="card-image" />
        <div class="distance-badge"><i class="fa-solid fa-location-dot"></i>{{ v.ubicacion }}</div>
        <button class="filter-btn" (click)="filterActivated()">
            <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
      <div class="card-info">
        <div class="title">
          <div class="card-name">{{ v.titulo}}</div>
          <div class="card-salary"><i class="fa-solid fa-hand-holding-dollar"></i>{{ ' $'+ v.salario }}</div>
        </div>
        <!--<div class="card-description">{{ v.description }}</div>-->
  
        <div class="tags">
          @for(tag of v.habilidades; track tag) {
          <div class="tag">{{ tag }}</div>
          }
        </div>

        <div class="tags">
          @for(tag of v.idiomas; track tag) {
          <div class="tag-language">{{ tag }}</div>
          }
        </div>
  
        <div class="info-row">
          <div class="info-item">
            <span><i class="fa-solid fa-city"></i></span>
            {{ v.empresa.name_empresa }}
          </div>
          <div class="info-item">
            <span><i class="fa-solid fa-id-card-clip"></i></span>
            {{ v.modalidad }}
          </div>
        </div>
      </div>
    </div>
  </div>
  }}
</div>
