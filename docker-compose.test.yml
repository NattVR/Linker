services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST_TEST}
      DB_USER: ${DB_USER_TEST}
      DB_PASSWORD: ${DB_PASSWORD_TEST}
      DB_DATABASE: ${DB_DATABASE_TEST}
      DB_PORT: ${DB_PORT:-5432}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped
