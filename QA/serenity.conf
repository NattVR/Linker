webdriver {
  driver = chrome
  driver.path = "/usr/bin/chromedriver"
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
  capabilities {
    "goog:chromeOptions" {
      binary = "/usr/bin/chromium"
      args = [
        "--headless=new",
        "--window-size=1920,1080",
        "--disable-gpu",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-extensions",
        "--disable-software-rasterizer",
        "--remote-debugging-port=0",
        "--user-data-dir=/tmp/chrome-user-data"
      ]
    }
  }
}

serenity {
  project.name = "Linker QA"
  report.encoding = "UTF-8"
  console.colors = true
  take.screenshots = FOR_FAILURES
  restart.browser.for.each = scenario
}

environments {
  default {
    webdriver.base.url = "http://localhost:4200"
    restapi.baseurl = "http://localhost:3000"
  }
  test {
    webdriver.base.url = "http://host.docker.internal:4201"
    restapi.baseurl = "http://host.docker.internal:3001"
  }
}